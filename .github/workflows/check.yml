name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  vocabulary:
    name: vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m pytest -n auto --dist loadgroup --durations=10

  # The reference runtime, at its default branch or the pull request a Depends-On: line names, run over this checkout,
  # before a merge and nightly: a pair of pull requests is proven together before either merges.
  compatibility:
    name: compatibility
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main

  ready-to-merge:
    name: ready-to-merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
        with:
          check: ready-to-merge

name: measure-383a
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
      - name: the two cases the first run missed, and the shared builds, alone then paired
        run: |
          P="python3 -m pytest -n 0 -q -p no:cacheprovider --durations=6"
          S='test_vocabulary.py::TestTermsTheShapesAndOntologyAgreeOn::TestGivenAnyShapesFile::test_is_shacl_that_shacl_accepts[ontologies/cascade.shapes.ttl]'
          E='test_queries.py::TestQueryForm::TestGivenAnyQuery::test_passes_every_value_it_adds_to_a_stem_through_encode_for_uri'
          F='test_queries.py::TestQueryForm::TestGivenAnyQuery::test_puts_every_sub_select_first_in_its_group'
          V='test_shapes.py::TestShapesThatFindAWrongPod::TestGivenAShapeCase::test_reports_exactly_the_results_the_manifest_lists_for_it[record-server-name/valid]'
          T='test_shapes.py::TestShapesThatFindAWrongPod::TestGivenAShapeCase::test_reports_exactly_the_results_the_manifest_lists_for_it[record-server-name/name-tampered]'
          for x in "$S" "$E" "$F" "$V"; do echo "=== ALONE $x"; $P "tests/$x" 2>&1 | tail -8; done
          echo "=== PAIR sub-select then encode"; $P "tests/$F" "tests/$E" 2>&1 | tail -9
          echo "=== PAIR valid then tampered"; $P "tests/$V" "tests/$T" 2>&1 | tail -9
          echo "=== setup/teardown of the cases, whole file test_queries.py"; python3 -m pytest -n 0 -q -p no:cacheprovider --durations=12 tests/test_queries.py 2>&1 | tail -18

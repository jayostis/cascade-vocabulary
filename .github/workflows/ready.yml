name: ready-to-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  ready-to-merge:
    name: ready-to-merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ready-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
        with:
          check: ready-to-merge
      # The body is read from the event, which an edit re-fires this workflow with; check.yml is not re-run by one.
      - uses: actions/checkout@v7
        if: ${{ !cancelled() }}
        with:
          path: breaking-tool
          persist-credentials: false
          sparse-checkout: .github/scripts/breaking_check.py
      - name: the body lists what it breaks
        if: ${{ !cancelled() }}
        run: python3 breaking-tool/.github/scripts/breaking_check.py

  rerun-when-edited:
    if: github.event.action == 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      pull-requests: read
    steps:
      - uses: jayostis/cascade-bridge-spec/.github/actions/rerun-when-edited@main
        with:
          workflows: check.yml
